name: Test / Publish

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet
        default: 'No'
        type: choice
        options:
          - 'No'
          - Staging
          - Production

jobs:
  verify-generated:
    name: Verify generated code and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Regenerate point group bindings
        run: dotnet run --project src/Nethermind.Crypto.Bls.Gen

      # stage first so newly generated (untracked) files are also compared
      - name: Check for drift
        run: |
          git add -A
          git diff --cached --exit-code

      - name: Verify formatting
        run: dotnet format whitespace src/Nethermind.Crypto.Bls.slnx --verify-no-changes

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      # an emulated x64 runtime would silently test win-x64/blst.dll instead
      - name: Verify runtime architecture
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $rid = dotnet --info | Select-String '^\s*RID:'
          Write-Output $rid
          if ($rid -notmatch 'win-arm64') { throw 'Expected a native arm64 .NET runtime' }

      - name: Install dependencies
        working-directory: src
        run: dotnet restore

      - name: Test
        working-directory: src/Nethermind.Crypto.Test
        run: dotnet test -c release --no-restore

  publish:
    name: Publish
    needs: [verify-generated, test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_URL: ${{ inputs.publish == 'Staging' && 'https://int.nugettest.org' || 'https://www.nuget.org' }}
      NUGET_SOURCE: ${{ inputs.publish == 'Staging' && 'https://apiint.nugettest.org' || 'https://api.nuget.org' }}/v3/index.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Detect version
        id: version
        working-directory: src
        run: |
          version_prefix=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          version_suffix=$(sed -n 's|.*<VersionSuffix>\(.*\)</VersionSuffix>.*|\1|p' Directory.Build.props)
          version=$version_prefix${version_suffix:+-$version_suffix}
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: NuGet login
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_URL }}
          token-service-url: ${{ env.NUGET_URL }}/api/v2/token

      - name: Publish
        working-directory: src
        run: |
          dotnet pack ./Nethermind.Crypto.Bls -c release \
            -p:Version=${{ steps.version.outputs.version }}.${{ github.run_number }}
          dotnet nuget push ./Nethermind.Crypto.Bls/bin/release/*.nupkg \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_SOURCE }}
